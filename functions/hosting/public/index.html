<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17283a" />
    <meta name="robots" content="noindex" />
    <title>GathR</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #17283a; background: radial-gradient(circle at 15% 10%, #dff2ff 0, transparent 36%), #f7f5f0; }
      main { width: min(100%, 520px); padding: 40px; border: 1px solid #e1e6e9; border-radius: 28px; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(23,40,58,.12); text-align: center; }
      .mark { width: 92px; height: 92px; margin: 0 auto 24px; display: block; object-fit: contain; filter: drop-shadow(0 12px 24px rgba(37,118,171,.24)); }
      h1 { margin: 0; font-size: clamp(30px,7vw,42px); letter-spacing: -.04em; }
      p { margin: 14px 0 0; color: #607080; font-size: 17px; line-height: 1.55; }
      a { display: inline-flex; margin-top: 28px; padding: 14px 22px; border-radius: 999px; color: white; background: #17283a; font-weight: 750; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="https://www.gathrapp.ca/assets/logos/icon.png" alt="GathR" />
      <h1>Find your next thing.</h1>
      <p>GathR brings nearby events, specials, and community discoveries together in one place.</p>
      <a href="https://www.gathrapp.ca/app">Open GathR</a>
    </main>
  </body>
</html>
